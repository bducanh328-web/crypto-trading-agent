name: Đèn crypto hằng ngày

on:
  schedule:
    - cron: "5 0 * * *"  # 00:05 UTC = 07:05 giờ Việt Nam, ngay sau khi nến 1D đóng
  workflow_dispatch:

concurrency:
  group: den
  cancel-in-progress: false

jobs:
  den:
    # Mặc định máy GitHub (Mỹ). Nếu Bitunix chặn vùng này, đặt biến kho RUNNER = nhãn máy tự host (vd. vn).
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài đặt
        run: pip install -e .
      - name: Khôi phục bộ đệm dữ liệu
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Đèn chung + bảng trạng thái
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cta den --telegram --summary "$GITHUB_STEP_SUMMARY"
