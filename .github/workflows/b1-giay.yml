name: B1 chạy giấy (BTC giao ngay)

on:
  schedule:
    # Lịch của GitHub có thể trễ hoặc bỏ lượt: chạy 3 lần, chỉ lần đầu có nến mới mới gửi Telegram
    - cron: "10 0 * * *"   # 07:10 giờ Việt Nam
    - cron: "43 1 * * *"   # 08:43
    - cron: "17 3 * * *"   # 10:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b1-giay
  cancel-in-progress: false

jobs:
  b1:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Tín hiệu + sổ giấy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USDT_VND: ${{ vars.USDT_VND || 26000 }}
        run: cta b1-giay --telegram --summary "$GITHUB_STEP_SUMMARY" ${{ github.event_name == 'schedule' && '--chi-khi-moi' || '' }}
      - name: Lưu sổ giấy
        run: |
          git config user.name "b1-bot"
          git config user.email "b1-bot@users.noreply.github.com"
          git add so_giay/
          git diff --cached --quiet || (git commit -m "Sổ giấy B1 $(date -u +%F)" && git push)
